name: 24H LinkedIn Lead Extractor & Analytics

on:
  workflow_dispatch:
    inputs:
      limit_queries:
        description: 'Number of queries to run (0 = all queries in sheet)'
        required: false
        default: '0'
      sync_tokens_only:
        description: 'Update all Apify token balances in Google Sheet only (do not scrape)'
        required: false
        type: boolean
        default: false

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Lead Extraction Pipeline
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          LIMIT_QUERIES: ${{ github.event.inputs.limit_queries || '0' }}
          SYNC_TOKENS_ONLY: ${{ github.event.inputs.sync_tokens_only && '1' || '0' }}
        run: |
          python main.py

      - name: Upload Local Backup Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linkedin-leads-backup-${{ github.run_number }}
          path: |
            leads_database.csv
            daily_analytics.csv
          if-no-files-found: ignore
          retention-days: 30

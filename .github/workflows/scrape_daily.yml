name: 24H LinkedIn Lead Extractor & Analytics

on:
  workflow_dispatch: # Manual one-click execution from GitHub Actions UI

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Lead Extraction Pipeline
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python main.py

      - name: Upload Local Backup Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linkedin-leads-backup-${{ github.run_number }}
          path: |
            leads_database.csv
            daily_analytics.csv
          retention-days: 30
